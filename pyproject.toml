[project]
name = "signal-verification"
version = "0.1.0"
description = "Credential-free Tilebox workflow for ground-event verification using Sentinel-2 and Sentinel-1."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
  "pillow>=12.2.0",
  "rasterio>=1.3",
  "shapely>=2.0",
  "tilebox-datasets>=0.58",
  "tilebox-workflows>=0.58",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
signal-verification-submit = "signal_verification.submit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signal_verification"]

[tool.pytest.ini_options]
testpaths = ["tests"]
